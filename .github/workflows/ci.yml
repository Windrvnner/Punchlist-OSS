# Runs `npm run check:all` on every pull request and every push to main, as it runs locally before a merge.
# Nothing here reads a model key: every step uses the mock backend and stand-in model.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# a newer push to the same pull request or branch replaces a run still going
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # types, lint, secrets, attribution, unit and end-to-end tests, the build, the browser suites and the built desktop
  # app end to end (on a virtual display), in the order check:all runs them
  check-all:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          # the attribution and readability checks compare the branch with main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      # the tests that convert Word and spreadsheet files need LibreOffice at /usr/bin/soffice
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libreoffice-writer libreoffice-calc
      - run: npm ci
      - run: npm run check:all
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-logs
          path: out/browser/*.log
          if-no-files-found: ignore

  # the Windows installer, kept as a download on the run (without LibreOffice, which is copied in on a release PC);
  # built only when the workflow is started by hand
  installer:
    if: github.event_name == 'workflow_dispatch'
    needs: check-all
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run installer
      - uses: actions/upload-artifact@v4
        with:
          name: punchlist-installer
          path: out/installer/*.exe
