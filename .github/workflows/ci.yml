# Runs the steps of `npm run check:all` on every pull request and every push to main, split into jobs that run at
# the same time. Nothing here reads a model key: every step uses the mock backend and stand-in model.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# a newer run for the same pull request replaces its run still going; every other run has a group of its own, so
# runs on main are never cancelled or dropped from the queue
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # types, lint, secrets, attribution, and readability hints
  static:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          # the attribution and readability checks compare the branch with main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check:static

  # the unit, backend and end-to-end tests, in three groups at once
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      # the tests that convert Word and spreadsheet files need LibreOffice at /usr/bin/soffice, and the two that need
      # more get it here, so no test is skipped in CI: Impress for a presentation, Carlito for column widths
      - run: >-
          sh scripts/ci-apt-install.sh libreoffice-writer libreoffice-calc
          libreoffice-impress fonts-crosextra-carlito
      - run: npm ci
      # as in check:all: LibreOffice must convert a workbook, and its tests then run on it rather than skip
      - run: node scripts/office-check.mjs
      - run: npm test -- --shard ${{ matrix.shard }}/3
        env:
          PUNCHLIST_OFFICE: required

  # the required check named "check": passes only when the static checks and every unit test group passed
  check:
    if: always()
    needs: [static, unit]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: |
          echo "static: ${{ needs.static.result }}, unit: ${{ needs.unit.result }}"
          test "${{ needs.static.result }}" = success && test "${{ needs.unit.result }}" = success

  # the browser suites against the built app, in four groups at once
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      # the layout checks measure the app with Inter in place of Segoe UI (tests/browser/fonts.conf)
      - run: |
          sh scripts/ci-apt-install.sh fonts-inter
          sudo cp tests/browser/fonts.conf /etc/fonts/conf.d/56-prefer-inter.conf
          fc-match "Segoe UI" | grep -q Inter
      - run: npm ci
      - run: npm exec -- vite build
      # the suites drive the runner's Google Chrome (/usr/bin/google-chrome) through Playwright
      - run: npm run browser -- --jobs 2 --shard ${{ matrix.shard }}/4
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-logs-${{ matrix.shard }}
          # with the new images of any screen that no longer looks as approved (tests/browser/approved.spec.mjs)
          path: |
            out/browser/*.log
            out/browser/approved/
          if-no-files-found: ignore

  # the built desktop app end to end on temporary folders, on a virtual display
  desktop:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: sh scripts/ci-apt-install.sh libreoffice-calc
      - run: npm exec -- vite build
      - run: node scripts/desktop-build.mjs
      - run: xvfb-run -a node tests/desktop/smoke.spec.mjs
      - run: xvfb-run -a node tests/desktop/signin.spec.mjs
      - run: xvfb-run -a node tests/desktop/qaLogRecovery.spec.mjs

  # the same desktop checks on Windows, where the app runs, to catch Windows-only faults (paths, file locks, line
  # endings), with the desktop's Node tests and the Q&A log recovery test; the backend's tests join them once they
  # pass on Windows (#719, #720)
  desktop-windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm exec -- vite build
      - run: node scripts/desktop-build.mjs
      - run: node tests/desktop/smoke.spec.mjs
      - if: ${{ !cancelled() }}
        run: node tests/desktop/signin.spec.mjs
      - if: ${{ !cancelled() }}
        run: npx vitest run tests/desktop
      # the Q&A log recovery test, where Windows file locks matter most; LibreOffice writes its workbook fixture
      - if: ${{ !cancelled() }}
        run: |
          choco install libreoffice-fresh --no-progress -y
          echo "C:\Program Files\LibreOffice\program" >> $env:GITHUB_PATH
      - if: ${{ !cancelled() }}
        run: node tests/desktop/qaLogRecovery.spec.mjs

  # the Windows installer, kept as a download on the run (without LibreOffice, which is copied in on a release PC);
  # built only when the workflow is started by hand
  installer:
    if: github.event_name == 'workflow_dispatch'
    needs: [check, browser, desktop, desktop-windows]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run installer
      - uses: actions/upload-artifact@v4
        with:
          name: punchlist-installer
          path: out/installer/*.exe
