<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Adaptive deal screen</title>
<link rel="stylesheet" href="app.css">
<script src="icons.js"></script>
<style>
/* Mock-up only. Every color is an app token or a mix the app already uses. */
.x-stage{display:flex;gap:var(--gap);height:100%;min-height:0;position:relative}
.x-conv{flex:1 1 auto;min-width:0;position:relative;display:flex;flex-direction:column;container-type:inline-size}
.x-head{flex:none;height:40px;display:flex;align-items:center;gap:6px;padding:0 0 0 10px}
.x-trail{display:flex;align-items:baseline;gap:7px;min-width:0;font-size:13px;color:var(--ink-2);white-space:nowrap}
.x-trail b{font-weight:600;color:var(--ink)}
.x-trail .sep{color:var(--ink-3)}
.x-trail .t{overflow:hidden;text-overflow:ellipsis;min-width:0}
.x-head .x-acts{margin-left:auto;display:flex;align-items:center;gap:6px;flex:none}
.x-head .hsel{display:inline-flex;align-items:center;gap:4px}
.x-head .hsel .chev{opacity:.7;display:inline-grid}
.btn.sm.ico{width:28px;padding:0}
.x-toggle{position:relative}
.x-toggle .dot{position:absolute;top:4px;right:4px;width:7px;height:7px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 2px var(--surface)}
.x-scroll{flex:1 1 auto;min-height:0;overflow:auto;scrollbar-width:none;padding:6px 20px 150px;-webkit-mask-image:linear-gradient(to bottom,transparent 0,transparent 30px,var(--mask) 64px);mask-image:linear-gradient(to bottom,transparent 0,transparent 30px,var(--mask) 64px)}
.x-col{max-width:740px;margin:0 auto}
.x .msgs{gap:16px;padding-top:4px}
.x .msgs .ai{font-size:14px;line-height:1.5;max-width:min(72ch,100%);min-width:0}
.x .rsch-pill,.x .rsch-chip{max-width:100%}.x .rsch-chip .docnm{display:block;overflow:hidden;text-overflow:ellipsis;min-width:0;white-space:nowrap}
.x .msgs .ai p{margin:0 0 8px}
.x .msgs .ai p:last-of-type{margin-bottom:0}
.x .msgs .me{font-size:13.5px;max-width:70%;padding:8px 13px}
.x .rsch{min-width:0;max-width:100%;display:flex;flex-direction:column;gap:6px;margin-bottom:10px}
.x .rsch-pill{height:28px;font-size:12.5px}
.x .rsch-chip{height:26px;font-size:12px}
.x .rsch-chip em{font-style:normal;color:var(--ink-3)}
.x .rsch-chip svg{color:var(--ink-3)}
.x .ref .rb{text-decoration:underline dotted var(--ink-3);text-underline-offset:4px;text-decoration-thickness:1px}
.x .acts{display:flex;gap:14px;margin-top:8px;color:var(--ink-2)}
.x .acts svg{display:block}
.x .acts .ib{display:grid;place-items:center;padding:0;border:0;background:none;color:inherit}
.x-card{display:flex;align-items:center;gap:12px;margin-top:10px;padding:10px 12px 10px 14px;border-radius:var(--r-card);background:var(--card);border:1px solid var(--line);font-size:13px;max-width:min(520px,100%);box-sizing:border-box;min-width:0}
.x-card .k{display:flex;flex-direction:column;min-width:0;flex:1 1 auto;gap:1px}
.x-card .k > span:not(.x-live){overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.x-card .k b{font-weight:600;color:var(--ink)}
.x-card .k span{color:var(--ink-2);font-size:12px}
.x-card .btn{margin-left:auto;flex:none}
.x-ring{flex:none;display:grid;place-items:center;color:var(--accent)}
.x-ring svg{display:block}
.x-composer{position:absolute;left:20px;right:20px;bottom:0;z-index:5}
.x-composer .askbox{max-width:740px;margin:0 auto;padding:12px 12px 10px;gap:6px}
.x .askbox textarea{font-size:14px;line-height:22px;min-height:22px;height:22px;padding:0 4px}
.x .askbox .scopebtn{height:28px;padding:0 10px;font-size:12px}
.x .askbox .send{width:30px;height:30px}
.x .askbox .send svg{width:15px;height:15px}
@container (max-width:440px){.x-composer .scopebtn .t{display:none}.x-composer .scopebtn{padding:0;width:28px;justify-content:center}.x-composer .scopebtn.mode{width:auto;padding:0 10px}}
/* empty deal: Home's layout, scoped to the deal */
.x-empty{flex:1 1 auto;display:flex;flex-direction:column;justify-content:center;padding:0 20px 56px}
.x-empty .center{width:100%;max-width:740px;margin:0 auto}
.x-empty .ttl{font:600 24px/1.15 var(--display);letter-spacing:-.4px;text-align:center;margin:0 0 14px}
.x-empty .askbox textarea{min-height:44px;height:44px}
/* the pane */
.x-pane{flex:0 0 var(--pw,520px);min-width:0;border-radius:var(--r-pane);display:flex;flex-direction:column;position:relative;overflow:visible;container-type:inline-size}
.x-pane>.inner{display:flex;flex-direction:column;min-height:0;height:100%;border-radius:inherit;overflow:hidden;position:relative;z-index:1}
.x-grip{position:absolute;left:-8px;top:50%;width:4px;height:40px;margin-top:-20px;border-radius:999px;background:var(--tick);z-index:3}
.x-grip.drag{background:var(--ink-3)}
.x-tabs{flex:none;display:flex;align-items:flex-end;height:46px;padding:0 10px 0 16px;box-shadow:inset 0 -1px 0 var(--line);gap:8px;min-width:0}
.x-tab{display:inline-flex;align-items:center;gap:6px;padding:0 2px 11px;border-bottom:2px solid transparent;font-size:13px;color:var(--ink-2);white-space:nowrap;min-width:0;flex:0 1 auto}
.x-tab .l{overflow:hidden;text-overflow:ellipsis;min-width:0}
.x-tab .n{font-size:12px;color:var(--ink-3);flex:none}
.x-tab .run{width:6px;height:6px;border-radius:50%;background:var(--accent);flex:none}
.x-tab .x{display:grid;place-items:center;color:var(--ink-3);flex:none;margin-left:1px;margin-top:-1px}
.x-tab .x svg{display:block}
.x-tab.on{color:var(--ink);border-bottom-color:var(--accent)}
.x-tab.on .n{color:var(--ink-2)}
.x-tabrow{display:flex;align-items:flex-end;gap:12px;min-width:0;flex:1 1 auto;overflow:hidden;align-self:stretch}
.x-tab.pin{flex:none}
.x-tab:not(.on){flex-shrink:0}
.x-tab:not(.pin):not(.on) .n{display:none}
.x-tab.on{flex-shrink:1;min-width:90px}
.x-tabs .end{margin-left:auto;align-self:center;flex:none;padding-left:4px}
.x-pbody{flex:1 1 auto;min-height:0;overflow:hidden;padding:14px 18px 18px;position:relative}
.x-lbl{font-size:13px;font-weight:600;color:var(--ink-2);display:flex;align-items:baseline;gap:6px;margin:4px 0 8px}
.x-lbl .n{font-weight:500;color:var(--ink-3);font-variant-numeric:tabular-nums}
/* Background tab */
.x-task{padding:12px 4px 12px 2px;border-bottom:1px solid var(--line);display:grid;grid-template-columns:20px minmax(0,1fr) auto;column-gap:10px;align-items:start}
.x-task:last-child{border-bottom:0}
.x-task .ic{padding-top:2px;color:var(--ink-3);display:grid;place-items:center}
.x-task .ic.on{color:var(--accent)}
.x-task .ic svg{display:block}
.x-task .tt{font-size:13.5px;font-weight:600;color:var(--ink);line-height:20px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.x-task .mm{font-size:12px;color:var(--ink-2);line-height:18px;margin-top:1px;font-variant-numeric:tabular-nums}
.x-task .mm .hi{color:var(--high);font-weight:500}
.x-task .act{align-self:start;margin-top:-4px}
.x-task .x-bar,.x-task .x-steps{grid-column:2/4}
.x-bar{height:4px;border-radius:999px;background:var(--bar-track);margin:8px 0 2px;overflow:hidden}
.x-bar i{display:block;height:100%;border-radius:inherit;background:var(--accent)}
.x-steps{margin:10px 0 0;padding:0;list-style:none;display:flex;flex-direction:column;gap:5px;font-size:12.5px;color:var(--ink-2);line-height:18px}
.x-steps li{display:grid;grid-template-columns:14px minmax(0,1fr);gap:8px;align-items:start}
.x-steps li span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.x-steps li i{display:grid;place-items:center;height:18px;color:var(--ink-3)}
.x-steps li i svg{display:block}
.x-steps li.now{color:var(--ink)}
.x-steps li.now i{color:var(--accent)}
.x-steps li.hit i{color:var(--high)}
.x-steps .pip{width:6px;height:6px;border-radius:50%;background:currentColor}
/* report */
.x-rhead{display:flex;align-items:center;gap:8px;margin:0 0 6px}
.x-rhead .seg{flex:none}
.x-rhead .end{margin-left:auto;display:flex;gap:8px}
.x-meta{font-size:12px;color:var(--ink-2);margin:0 0 10px 2px;font-variant-numeric:tabular-nums}
.x-grp{font-size:13px;font-weight:600;color:var(--ink-2);padding:12px 0 6px 12px;display:flex;gap:6px;align-items:baseline}
.x-grp .n{font-weight:500;color:var(--ink-3)}
.x-row{display:grid;grid-template-columns:14px minmax(0,1fr) auto;column-gap:14px;align-items:center;min-height:36px;padding:7px 10px 7px 12px;border-bottom:1px solid var(--line);font-size:13px;color:var(--ink);border-radius:0}
.x-row .mk{min-height:18px}
.x-row .t{line-height:1.4;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.x-row .s{font-size:12px;color:var(--ink-2);white-space:nowrap;display:inline-flex;align-items:center}
.x-row.on{background:var(--glass-2);border-radius:var(--r-ctl);box-shadow:inset 0 1px 0 var(--spec),0 0 0 1px var(--glass-edge);border-bottom-color:transparent}
/* issue */
.x-issue .top{display:flex;align-items:center;gap:8px;margin:2px 0 10px}
.x-issue .top .m{font-size:13px;font-weight:600;color:var(--ink-2);line-height:28px}
.x-issue .top .end{margin-left:auto;display:flex;gap:8px}
.x-issue h2{font:600 17px/1.35 var(--body);letter-spacing:-.15px;margin:0 0 10px}
.x-issue .rsch-chips{margin:0 0 12px}
.x-issue p{font-size:14px;line-height:1.5;margin:0 0 16px}
.x-issue .x-lbl{margin-top:18px}
.x-issue .lnk{font-size:14px;text-decoration:underline dotted var(--ink-3);text-underline-offset:4px;text-decoration-thickness:1px}
.x-q{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:baseline;font-size:13px;padding:8px 0;border-bottom:1px solid var(--line)}
.x-q b{font-weight:600}
.x-q .s{color:var(--ink-2);font-size:12px}
.x-issue > .btn.sm{margin-top:14px}
/* document */
.x-docstage{position:absolute;inset:0;overflow:hidden;padding:18px 18px 0;display:flex;justify-content:center}
.x-page{background:var(--paper);color:var(--paper-ink);width:100%;max-width:560px;padding:40px 44px;box-shadow:var(--shadow-page);font:13.5px/1.7 "Times New Roman",Times,serif;min-height:720px}
.x-page .hd{display:flex;justify-content:space-between;font:11px/1 var(--body);color:var(--paper-muted);border-bottom:1px solid var(--paper-rule);padding-bottom:8px;margin-bottom:18px}
.x-page h3{font:700 14px/1.3 var(--body);color:var(--paper-ink);margin:0 0 12px;letter-spacing:.2px}
.x-page p{margin:0 0 10px;display:grid;grid-template-columns:34px minmax(0,1fr)}
.x-page p.sub{grid-template-columns:34px 28px minmax(0,1fr)}
.x-page mark{background:var(--paper-hl);color:var(--paper-ink);padding:1px 0}
.x-docnav{position:absolute;left:50%;transform:translateX(-50%);bottom:14px;display:flex;align-items:center;gap:4px;padding:5px 6px;border-radius:999px;background:var(--capsule);backdrop-filter:blur(24px) saturate(150%);border:1px solid var(--glass-edge);box-shadow:inset 0 1px 0 var(--spec),var(--shadow-pop);white-space:nowrap;max-width:calc(100% - 28px)}
.x-docnav>button{width:30px;height:30px;border:0;border-radius:999px;background:none;color:var(--ink-2);display:grid;place-items:center;flex:none}
.x-docnav>button svg{display:block}
.x-docnav .nm{display:flex;align-items:center;gap:10px;padding:0 10px;font-size:12.5px;color:var(--ink-3);min-width:0}
.x-docnav .nm b{font-weight:500;color:var(--ink);overflow:hidden;text-overflow:ellipsis;min-width:0}
.x-docnav .nm span{flex:none}
/* Q&A */
.x-qact{display:flex;align-items:center;gap:8px}
.x-qtools{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:0 0 10px}
.x-qtools .field{flex:1 1 120px;min-width:80px;height:32px;font-size:13px;display:flex;align-items:center;color:var(--ink-3)}
.x-table{font-size:13px}
.x-th,.x-tr{display:grid;grid-template-columns:48px 60px 112px minmax(0,1.3fr) minmax(0,1fr) 70px;column-gap:14px;padding:0 8px 0 4px}
.x-th{font-size:11px;font-weight:600;color:var(--ink-2);height:30px;align-items:center;border-bottom:1px solid var(--line)}
.x-tr{padding-top:9px;padding-bottom:9px;border-bottom:1px solid var(--line);align-items:start;color:var(--ink-2)}
.x-tr .n,.x-th .n{font-variant-numeric:tabular-nums}
.x-tr .q{color:var(--ink);line-height:1.4;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.x-tr .r{line-height:1.4;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.x-tr .d{font-variant-numeric:tabular-nums;white-space:nowrap}

.x-tr.on{background:var(--card);border-radius:var(--r-ctl)}
@container (max-width:700px){.x-th,.x-tr{grid-template-columns:48px 60px minmax(0,1.2fr) minmax(0,1fr) 70px}.x-th .ws,.x-tr .ws{display:none}}
@container (max-width:520px){.x-th,.x-tr{grid-template-columns:48px minmax(0,1.2fr) minmax(0,1fr) 70px}.x-th .p,.x-tr .p{display:none}}
@container (max-width:760px){.x-qtools .wide{display:none}}
@container (max-width:560px){.x-qtools .field,.x-qtools .seg .c{display:none}}
.x-foot{position:absolute;left:0;right:0;bottom:0;height:44px;display:flex;align-items:center;padding:0 18px;font-size:12px;color:var(--ink-3);border-top:1px solid var(--line);background:var(--glass);backdrop-filter:blur(28px) saturate(150%);font-variant-numeric:tabular-nums}
/* tab treatment B: compact chips (an alternative) */
.x-chips{flex:none;display:flex;align-items:center;gap:6px;overflow:hidden;height:48px;padding:0 10px;box-shadow:inset 0 -1px 0 var(--line);min-width:0}
.x-chip{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 10px;border-radius:999px;font-size:12px;font-weight:500;color:var(--ink-2);white-space:nowrap;min-width:0;flex:none;background:var(--card);box-shadow:0 0 0 1px var(--line) inset}
.x-chip svg{display:block;flex:none}
.x-chip .ic{display:grid;place-items:center;flex:none;color:var(--ink-3)}
.x-chip .ic.run{color:var(--accent)}
.x-chip:not(.on) .ic.run .x-ring{color:var(--ink-3)}
.x-chip .l{overflow:hidden;text-overflow:ellipsis;min-width:0}
.x-chip .n{color:var(--ink-3);font-variant-numeric:tabular-nums;flex:none}
.x-chip .x{display:grid;place-items:center;color:var(--ink-3);flex:none;margin-right:-3px}
.x-chip.on{background:var(--glass-2);box-shadow:inset 0 1px 0 var(--spec),0 0 0 1px var(--glass-edge);color:var(--ink);flex:0 1 auto}
.x-chip.on .ic{color:var(--ink-2)}
.x-chip.on .ic.run{color:var(--accent)}

.x-chips.io .x-chip:not(.on) .l,.x-chips.io .x-chip:not(.on) .n{display:none}
.x-chips.io .x-chip:not(.on){width:28px;padding:0;justify-content:center}
/* tab treatment S: tabs share the bar's width (the chosen treatment) */
.x-strip{flex:none;display:flex;align-items:center;height:50px;padding:0 10px;box-shadow:inset 0 -1px 0 var(--line);min-width:0}
.x-strip .trk{display:flex;gap:2px;padding:3px;width:100%;min-width:0;border-radius:999px;background:color-mix(in srgb,var(--ink) 6%,transparent);box-shadow:inset 0 0 0 1px var(--line)}
.x-stab{flex:1 1 0;min-width:30px;display:flex;align-items:center;justify-content:center;gap:6px;height:28px;padding:0 10px;border-radius:999px;font-size:12px;font-weight:500;color:var(--ink-2);white-space:nowrap;overflow:hidden}
.x-stab svg{display:block;flex:none}
.x-stab .ic{display:grid;place-items:center;color:var(--ink-3);flex:none}
.x-stab .l{overflow:hidden;text-overflow:ellipsis;min-width:0}
.x-stab .n{color:var(--ink-3);flex:none}
.x-stab .x{display:grid;place-items:center;color:var(--ink-3);flex:none;margin-left:auto}
.x-strip .trk.allico .x-stab.on{flex:1 1 auto;max-width:none}
.x-stab.on{flex:0 0 auto;max-width:68%;min-width:120px;background:var(--glass-2);box-shadow:inset 0 1px 0 var(--spec),0 0 0 1px var(--glass-edge),0 1px 3px var(--inset-edge);color:var(--ink);justify-content:flex-start}
.x-stab.on .ic{color:var(--ink-2)}
.x-stab:not(.on) .ic .x-ring{color:var(--accent)}
.x-stab.on .ic .x-ring{color:var(--accent)}
.x-strip .trk.one{width:auto}.x-strip .trk.one .x-stab{flex:none}
/* a lone tab fits its name */
.x-strip .trk.one .x-stab.on{min-width:max-content;padding-right:14px}
/* a chat card's mark sits on its title line, as in the task list */
.x .x-card > .x-ring{align-self:flex-start;margin-top:1px}
.x-stab.tight .n{display:none}
.x-stab.ico .l,.x-stab.ico .n{display:none}
.x-stab.ico{padding:0;flex:0 0 34px}
/* a running tab keeps its name beside the ring */
.x-stab.keep{flex:0 0 auto}
.x-stab.keep .n{display:none}
/* tab treatment A: segmented */
.x-segtabs{flex:none;display:flex;align-items:center;height:52px;padding:0 10px;box-shadow:inset 0 -1px 0 var(--line);min-width:0}
.x-segtabs .seg{min-width:0;max-width:100%}
.x-segtabs .seg button{display:inline-flex;align-items:center;gap:5px;min-width:0;max-width:150px;overflow:hidden;flex:0 1 auto}
.x-segtabs .seg button span{overflow:hidden;text-overflow:ellipsis;min-width:0}
.x-segtabs .seg button i{width:6px;height:6px;border-radius:50%;background:var(--accent);flex:none}
/* tab treatment C: browser-style strip */
.x-btabs{flex:none;display:flex;align-items:flex-end;gap:2px;height:44px;padding:0 10px;min-width:0;position:relative;overflow:hidden}
.x-btabs::after{content:"";position:absolute;left:0;right:0;bottom:0;border-bottom:1px solid var(--line)}
.x-btab{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 12px;border-radius:10px 10px 0 0;font-size:12px;font-weight:500;color:var(--ink-2);white-space:nowrap;min-width:34px;flex:0 1 auto;position:relative;z-index:1;border:1px solid transparent;border-bottom:0}
.x-btab svg{display:block;flex:none}
.x-btab .ic{display:grid;place-items:center;color:var(--ink-3)}
.x-btab .l{overflow:hidden;text-overflow:ellipsis;min-width:0}
.x-btab .n{color:var(--ink-3)}
.x-btab:not(.on) .n{display:none}
.x-btab.ico .l{display:none}
.x-btab.ico{flex:none;padding:0 10px}
.x-btab{overflow:hidden}
.x-btab .x{display:grid;place-items:center;color:var(--ink-3);margin-right:-3px}
.x-btab.on{background:var(--glass-2);border-color:var(--glass-edge);box-shadow:inset 0 1px 0 var(--spec);color:var(--ink);flex:0 0 auto;max-width:60%;height:36px;margin-bottom:-1px;z-index:2}
.x-btab:not(.on)+.x-btab:not(.on)::before{content:"";position:absolute;left:-2px;top:10px;height:14px;border-left:1px solid var(--line)}
@container (max-width:400px){.x-btab:not(.on) .l,.x-btab:not(.on) .n{display:none}
.x-btab.ico .l{display:none}
.x-btab.ico{flex:none;padding:0 10px}}
/* switcher (not offered) */
.x-switch{flex:none;display:flex;align-items:center;gap:8px;height:48px;padding:0 10px;box-shadow:inset 0 -1px 0 var(--line);min-width:0;position:relative;z-index:5}
.x-switch .pick{display:inline-flex;align-items:center;gap:6px;min-width:0;max-width:calc(100% - 44px)}
.x-switch .pick .l{overflow:hidden;text-overflow:ellipsis;min-width:0}
.x-switch .pick .chev{display:inline-grid;opacity:.7;flex:none}
.x-switch .pick>svg{flex:none;color:var(--ink-2)}
.x-switch .end{margin-left:auto;display:flex;gap:8px}
.x-menu{position:absolute;z-index:80;width:300px;padding:8px;border-radius:12px;background:var(--glass-2);border:1px solid var(--glass-edge);backdrop-filter:blur(12px) saturate(150%);box-shadow:inset 0 1px 0 var(--spec),inset 0 -1px 0 var(--inset-edge),var(--shadow-pop);background-image:linear-gradient(135deg,var(--glass-sheen),transparent 40%)}
:root[data-theme="light"] .x-menu{background:color-mix(in srgb,var(--menu-solid) 36%,transparent)}
