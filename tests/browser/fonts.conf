<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- On Linux, the browser suites measure the app with Inter in place of Segoe UI, the Windows interface font that the
     app's styles name first (src/styles.css). Copy this file into /etc/fonts/conf.d/ as 56-prefer-inter.conf, with
     the fonts-inter package installed; the layout checks fail with wider fallback fonts. -->
<fontconfig>
  <alias><family>Segoe UI Variable Display</family><prefer><family>Inter</family></prefer></alias>
  <alias><family>Segoe UI Variable Text</family><prefer><family>Inter</family></prefer></alias>
  <alias><family>Segoe UI</family><prefer><family>Inter</family></prefer></alias>
  <alias><family>system-ui</family><prefer><family>Inter</family></prefer></alias>
  <alias><family>sans-serif</family><prefer><family>Inter</family></prefer></alias>
</fontconfig>
